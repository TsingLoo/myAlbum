services:
  openlist:
    image: openlistteam/openlist:${OPENLIST_VERSION:-latest}
    container_name: openlist
    user: "${OPENLIST_UID:-1000}:${OPENLIST_GID:-1000}"
    volumes:
      - ./data:/opt/openlist/data
    ports:
      - "5244:5244"
    environment:
      - UMASK=077
      - TZ=Asia/Hong_Kong
    dns:
      - 192.168.30.1
      - 223.5.5.5
    restart: unless-stopped
