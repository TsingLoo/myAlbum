<VirtualHost *:8080>
    ServerName myhome.server

    Alias /lan-share/ /srv/lan-share/
    Alias /file-backup/ @STORAGE_ROOT@/file-backup/

    <Directory /srv/lan-share>
        DAV On
        Options Indexes
        AllowOverride None
        AuthType Basic
        AuthName "myhome LAN share"
        AuthUserFile /etc/apache2/family-webdav.htpasswd
        <RequireAll>
            Require valid-user
            Require ip 127.0.0.1 192.168.30.0/24
        </RequireAll>
    </Directory>

    <Directory @STORAGE_ROOT@/file-backup>
        DAV On
        Options Indexes
        AuthType Basic
        AuthName "File Backup"
        AuthUserFile /etc/apache2/family-webdav.htpasswd
        <RequireAll>
            Require valid-user
            Require ip 127.0.0.1 192.168.30.0/24
        </RequireAll>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/family-webdav-error.log
    CustomLog ${APACHE_LOG_DIR}/family-webdav-access.log combined
</VirtualHost>
